name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    outputs:
      image_changed: ${{ steps.changes.outputs.image_changed }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect image changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            changed=true
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only "$BASE_SHA" HEAD > /tmp/dsh-changed-files
            if grep -Eq '^(Dockerfile$|docker/|scripts/smoke-test\.sh$)' /tmp/dsh-changed-files; then
              changed=true
            fi
          fi
          echo "image_changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Test release state transitions
        run: make test
      - name: Check shell scripts
        run: |
          find docker scripts -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Check Compose configuration
        run: |
          docker compose config --quiet
          DOCKER_GID=999 docker compose -f docker-compose.yml -f docker-compose.docker.yml config --quiet
      - name: Check workflow syntax
        run: |
          # GitHub supports concurrency.queue; actionlint 1.7.12 does not yet.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -ignore '^unexpected key "queue" for "concurrency" section\.'

  image:
    needs: checks
    if: needs.checks.outputs.image_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            optional_tools: 'true'
          - arch: arm64
            runner: ubuntu-24.04-arm
            optional_tools: 'true'
          - arch: amd64
            runner: ubuntu-24.04
            optional_tools: 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: dsh:test
          build-args: |
            INSTALL_PYTHON=${{ matrix.optional_tools }}
            INSTALL_GO=${{ matrix.optional_tools }}
            INSTALL_DOCKER=${{ matrix.optional_tools }}
          cache-from: |
            type=gha,scope=ci-${{ matrix.arch }}-${{ matrix.optional_tools }}
            type=gha,scope=dsh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}-${{ matrix.optional_tools }}
      - name: Enable unprivileged namespaces on disposable runner
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Smoke test
        timeout-minutes: 10
        env:
          OPTIONAL_TOOLS: ${{ matrix.optional_tools }}
        run: bash scripts/smoke-test.sh dsh:test "$OPTIONAL_TOOLS" "$OPTIONAL_TOOLS" "$OPTIONAL_TOOLS"
